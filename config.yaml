database:
  dbname: 'ontology_db'
  user: 'fox'
  password: 'drowssap'
  host: 'localhost'
  port: '5432'

general:
  language: 'en'  # Fix a specific language for filtering the knowledge bases
  sources: ['parmenides', 'conceptnet', 'wiktionary', 'wordnet', 'geonames']
  mapping_sources: ['wordnet', 'conceptnet', 'wiktionary']
  mode: 'db'  # graph / db
  should_cache: true
  show_stats: true
  verbose: true

db_config:
  tables_to_delete: ['relations', 'properties', 'urls', 'concepts']
  source_to_delete: []  # Set to [] to delete all sources
  clear_db_on_start: true  # Set to true to drop and recreate the database tables on every run
  confirm_clear_db: true
  unique_source: false
  bulk_insert: false
  batch_size: 10000

graph:
  type: 'oxigraph' # oxigraph / rdf

local_files:
  supporting_files: 'supporting_files'
  cache: '.cache'

  # Paths to the local data files for knowledge bases and their corresponding mapping configurations
  wordnet: 'supporting_files/kb/WordNet.nt'
  wordnet_edge_mappings_file: 'supporting_files/mappings/wn_edge_mappings.json'
  wordnet_pos_mappings_file: 'supporting_files/mappings/wn_pos_mappings.json'

  conceptnet: 'supporting_files/kb/ConceptNet.csv'
  conceptnet_edge_mappings_file: 'supporting_files/mappings/cn_edge_mappings.json'
  conceptnet_pos_mappings_file: 'supporting_files/mappings/cn_pos_mappings.json'

  wiktionary: 'supporting_files/kb/Wiktionary.json'
  wiktionary_edge_mappings_file: 'supporting_files/mappings/wk_edge_mappings.json'
  wiktionary_pos_mappings_file: 'supporting_files/mappings/wk_pos_mappings.json'

  parmenides: 'supporting_files/parmenides'

  geonames: 'supporting_files/kb/GeoNames/all_countries.csv'
  geonames_hierarchy: 'supporting_files/kb/GeoNames/hierarchy.json'
  geonames_alternates: 'supporting_files/kb/GeoNames/alternates_map.json'
  geonames_ignore: 'supporting_files/kb/GeoNames/ignored_places.txt'
  geonames_feature_codes: 'supporting_files/kb/GeoNames/feature_map.json'
  geonames_links: 'supporting_files/kb/GeoNames/geo_links.json'

  dbpedia_labels: 'supporting_files/kb/dbpedia/dbpedia_labels_en_filtered.ttl'
  dbpedia_types: 'supporting_files/kb/dbpedia/endbpedia-enriched_subjectns=dbpedia-org_vocab=rdf_props=type.ttl'
  dbpedia_ignored_uris: 'supporting_files/kb/dbpedia/ignored_uris.txt'
  dbpedia_properties: 'supporting_files/kb/dbpedia/endbpedia-enriched_subjectns=dbpedia-org_vocab=wdt_props=all.ttl'
  wikidata_property_labels: 'supporting_files/kb/dbpedia/dbpedia_props.csv'
  wikidata_labels: 'supporting_files/kb/dbpedia/latest-truthy-en-labels-only.nt'
  wikidata_allowed_ids: 'supporting_files/kb/dbpedia/allowed_wiki_ids.txt'

  ontology_classes: 'supporting_files/mappings/ontology_classes.json'
  rejected_classes: 'supporting_files/mappings/ignored_classes.json'

  pos_tag_classes: 'supporting_files/mappings/pos_tag_mappings.json'

turtle_export:
  convert: false
  normalise_pos: true
  output_file: 'NEW_ontology_db_oxi_clustered_final.ttl'
  base_uri: "https://ofox.co.uk/honk#"
  base_prefix: "honk"

clustering:
  enabled: true
  keep_url_triples: false  # Set to true to preserve hasURL triples after clustering (e.g. for scalability tests)

evaluator:
  output_csv: "evaluation_results.csv"
  run_deterministic_evaluation: true
  run_semantic_evaluation: true
  embedding_models:
    - "all-MiniLM-L6-v2"
    - "sentence-transformers/all-mpnet-base-v2"
    - "BAAI/bge-m3"
  run_llm_evaluation: true
  max_parallel_queries: 8
  max_extraction_workers: 8
  llms:
    - "llama3.2:3b"
    - "qwen2.5:7b"
    - "mistral:7b"
  bridging_limit: 100
  summary_table_output: "evaluator/summary_table.txt"
  max_context_triples: 100
  max_bridge_triples: 20
  embedding_top_k: 5        # top-K triples used for per-triple similarity mean

  ontologies:
    baseline: "../ontologies/ontology_db_CN_UNNORM_UNCLUSTERED.nt"
    honk: "../ontologies/ontology_db_oxi_clustered_final.nt"

  test_cases:
    # Biological Taxonomy
    - sentence: "The parasitic mite belongs to the order Acarina"
      keywords: ["mite", "Acarina", "arachnid"]
      label: "sent:mite"
    - sentence: "Caenogenesis, also called kenogenesis, involves novel developmental structures"
      keywords: ["caenogenesis", "kenogenesis", "ontogeny", "embryology"]
      label: "sent:caenogenesis"

    # Medical & Spelling Variants
    - sentence: "The specialist treated the hematopathy, also described as a hemopathy"
      keywords: ["hematopathy", "hemopathy", "blood disorder"]
      label: "sent:hematopathy"
    - sentence: "The paediatrician treats sick children"
      keywords: ["paediatrician", "pediatrician", "illness", "children"]
      label: "sent:paediatrician"

    # Geographic & Physical Features
    - sentence: "The wadi runs completely dry for most of the year in this arid region"
      keywords: ["wadi", "dry", "stream", "intermittent"]
      label: "sent:wadi"
    - sentence: "The harbour set dockage charges, known as moorage fees, for overnight berths"
      keywords: ["dockage", "moorage", "harbour", "berth"]
      label: "sent:harbour"

    # Lexical & Register Variation
    - sentence: "The car bonnet is open"
      keywords: ["bonnet", "car", "hood"]
      label: "sent:bonnet"
    - sentence: "Basketry is another word for basketwork, the craft of weaving baskets"
      keywords: ["basketry", "basketwork", "basket"]
      label: "sent:basketry"
    - sentence: "A ferry is also called a ferryboat"
      keywords: ["ferry", "ferryboat", "boat"]
      label: "sent:ferry"
    - sentence: "Letters can be posted in the pillar box, a traditional British mailbox"
      keywords: ["pillar box", "mailbox", "postbox", "post"]
      label: "sent:pillarbox"
    - sentence: "The teahouse served soochong, more commonly spelt souchong"
      keywords: ["soochong", "souchong", "tea"]
      label: "sent:soochong"

    # Scientific Precision
    - sentence: "Students confuse entomology, the study of insects, with etymology"
      keywords: ["entomology", "etymology", "insects", "words"]
      label: "sent:entomology"

    # Transitive Cluster Discoveries
    - sentence: "A settee is a type of sofa, also known as a couch or divan"
      keywords: ["settee", "sofa", "couch", "divan"]
      label: "sent:settee"
    - sentence: "A boomerang is a throwing stick used as a hunting device"
      keywords: ["boomerang", "throwing stick", "device", "curved"]
      label: "sent:boomerang"
    - sentence: "A crawdad is a common name for a crayfish"
      keywords: ["crawdad", "crayfish", "crustacean"]
      label: "sent:crawdad"

llm_config:
  max_llm_workers: 4       # Number of concurrent requests sent to Ollama
  temperature: 0.0         # 0.0 makes the model deterministic
  llm_iterations: 1